name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test (pipeline.did,
# DidClientLiveTests) against the resource key that carries the fodid
# product, which is _51DEGREES_RESOURCE_KEY_BESPOKE. The central common-ci
# script exports the _51DEGREES_RESOURCE_KEY* secrets as environment
# variables, and this workflow sets the single _51DEGREES_RESOURCE_KEY the
# test reads from the bespoke one.
#
# The tests ask the cloud for a marketing 51Did, so a key without the fodid
# product gets an answer with no identifier in it and the tests fail saying
# so. Running them once per key would therefore report a failure for every
# key below bespoke, which is entitlement working correctly rather than a
# fault, so only the bespoke key is used.
#
# A run with no key available fails. A cloud test that passes without
# calling the cloud reports success having proved nothing, and that is
# worse than a red job.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '10 5 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'pipeline.did/**'
      - 'owid-java/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline.did builds against the owid-java submodule source.
          submodules: recursive
      - name: Checkout common-ci
        uses: actions/checkout@v4
        with:
          # Provides steps/set-resource-keys.ps1, the central script that
          # exports the _51DEGREES_RESOURCE_KEY* secrets as environment
          # variables.
          repository: 51Degrees/common-ci
          path: common-ci
      - uses: actions/setup-java@v4
        with:
          # The reactor targets 1.8, so the tests are compiled and run on a
          # toolchain that can still produce it.
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Cloud 51Did test against the fodid entitled key
        shell: pwsh
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          ./common-ci/steps/set-resource-keys.ps1 -Keys (ConvertFrom-Json -AsHashtable $env:SECRETS)
          $key = $env:_51DEGREES_RESOURCE_KEY_BESPOKE
          if (-not $key) {
            throw ('No _51DEGREES_RESOURCE_KEY_BESPOKE secret is available, ' +
              'so the live 51Did tests cannot call the cloud service. That ' +
              'key carries the fodid product these tests need. A pull ' +
              'request from a fork gets no secrets, so run this workflow ' +
              'from a branch in this repository.')
          }
          $env:_51DEGREES_RESOURCE_KEY = $key
          mvn -B -pl pipeline.did -am test `
            -Dtest=DidClientLiveTests -DfailIfNoTests=false
          exit $LASTEXITCODE
